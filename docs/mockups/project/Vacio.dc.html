<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>País sin miembros</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Instrument Sans",system-ui,sans-serif}
.ph{width:400px;min-height:640px;box-sizing:border-box;background:#0B0D0C;color:#E8EAE6;padding:20px 16px 24px;font-size:16px;line-height:1.5}
.sample{display:inline-block;border:1px solid #F2A93A;color:#F2A93A;border-radius:4px;padding:4px 8px;font-size:12.8px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.hd h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em;color:#B6F23A}
.meta{font:500 12px "JetBrains Mono",monospace;color:#8B918A}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{flex:none;white-space:nowrap;background:#141715;color:#8B918A;border:1px solid #262B27;border-radius:4px;padding:6px 10px;font:inherit;font-size:13.6px}
.tab.on{background:#B6F23A;border-color:#B6F23A;color:#0B0D0C;font-weight:600}
.country{display:flex;gap:8px;align-items:center;color:#8B918A;font-size:13.6px;margin-bottom:16px}
.country select{background:#141715;color:#E8EAE6;border:1px solid #262B27;border-radius:4px;padding:4px 8px;font:inherit;font-size:13.6px}
.empty{background:#141715;border:1px solid #262B27;border-radius:8px;padding:32px 16px;text-align:center}
.empty p{margin:0 0 4px}
.empty .big{font-size:20px;font-weight:700}
.empty .sm{color:#8B918A;font-size:14.4px;margin-bottom:20px}
.cta{display:inline-block;background:#B6F23A;color:#0B0D0C;font-weight:700;font-size:16px;padding:12px 24px;border-radius:8px;text-decoration:none}
.fresh{margin:16px 0 0;border-top:1px solid #262B27;padding-top:12px;color:#8B918A;font-size:12.8px}
.fresh::before{content:"// ";font-family:"JetBrains Mono",monospace;color:#F2A93A}
.fresh b{color:#E8EAE6;font-weight:600}
</style>
</helmet>
<div class="ph">
  <span class="sample">Datos de ejemplo: aún no hay ranking real.</span>
  <div class="hd"><h1>Podio</h1><span class="meta">top · 12 meses</span></div>
  <div class="tabs" role="tablist" aria-label="Categoría">
    <button type="button" role="tab" aria-selected="true" class="tab on">Contribuciones del año</button>
    <button type="button" role="tab" aria-selected="false" class="tab">Racha actual</button>
    <button type="button" role="tab" aria-selected="false" class="tab">Racha más larga</button>
    <button type="button" role="tab" aria-selected="false" class="tab">PRs a otros repos</button>
    <button type="button" role="tab" aria-selected="false" class="tab">Estrellas</button>
  </div>
  <label class="country" for="pais">País
    <select id="pais"><option>🇵🇾 PY</option></select>
  </label>
  <div class="empty" role="status">
    <p class="big">Aún no hay nadie aquí.</p>
    <p class="big" style="color:#B6F23A">¡Sé la primera persona!</p>
    <p class="sm">Nadie de 🇵🇾 Paraguay se anotó todavía. Sumate y abrí el podio de tu país: solo aparece quien lo pide.</p>
    <a class="cta" href="#">Sumate al podio</a>
  </div>
  <p class="fresh"><b>Actualizado: 25/11/2026, 06:00</b></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
